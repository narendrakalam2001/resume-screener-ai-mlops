name: CI — Resume Screener AI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create required directories
        run: mkdir -p resume_models logs data docs/plots

      - name: Run pytest
        run: pytest tests/test_pipeline_core.py -v --cov=src --cov-report=term-missing
